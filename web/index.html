<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#111418">
<meta name="color-scheme" content="dark light">
<script>
  // 主題要在畫面出來前決定，避免先閃一下另一種配色。
  // 設定存在 localStorage "theme"：auto（跟隨系統）／light／dark
  (() => {
    const systemLight = matchMedia("(prefers-color-scheme: light)");
    function applyTheme() {
      let choice = "auto";
      try { choice = JSON.parse(localStorage.getItem("theme")) || "auto"; } catch {}
      const light = choice === "light" || (choice === "auto" && systemLight.matches);
      document.documentElement.dataset.theme = light ? "light" : "dark";
      document.getElementById("themeColor")?.setAttribute("content", light ? "#f4f5f7" : "#111418");
    }
    applyTheme();
    systemLight.addEventListener("change", applyTheme);
    window.applyTheme = applyTheme;
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<title>排球動作步進</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #111418;
    --panel: #1b2027;
    --panel-2: #252b34;
    --text: #e8ebef;
    --muted: #9aa3ad;
    --accent: #f5a623;
    --buffer: #4a525d;
    --track: #2e343d;
    --danger: #ff7b72;
    --pressed: #39414d;
    --on-accent: #111;          /* 橘色按鈕上的字 */
    --accent-text: #f5a623;     /* 橘色當文字用（連結、★） */
    color-scheme: dark;
  }
  /* 淺色配色（跟隨系統或手動選擇，由 <head> 的 applyTheme 設定 data-theme）；影片框維持黑底 */
  :root[data-theme="light"] {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --panel-2: #e4e7ec;
    --text: #15181c;
    --muted: #5b6570;
    --buffer: #b4bcc6;
    --track: #d6dbe2;
    --danger: #c62828;
    --pressed: #cdd3db;
    --accent-text: #a35f00;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.5 system-ui, -apple-system, "Noto Sans TC", "PingFang TC", sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button, input { font: inherit; color: inherit; }
  button {
    background: var(--panel-2); border: 0; border-radius: 10px;
    padding: 10px 12px; cursor: pointer; touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  button:active, button.pressed { background: var(--pressed); }
  [hidden] { display: none !important; }

  /* ---- 首頁 ---- */
  #home { max-width: 640px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 22px; margin: 0; }
  .home-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0 20px; }
  #themeBtn { font-size: 14px; padding: 6px 10px; white-space: nowrap; }
  .open-row { display: flex; gap: 8px; }
  .open-row input {
    flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--track);
    border-radius: 10px; padding: 10px 12px;
  }
  .open-row button { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  #openError { color: var(--danger); min-height: 1.5em; margin: 6px 0 0; font-size: 14px; }
  h2 { font-size: 15px; color: var(--muted); font-weight: 500; margin: 24px 0 8px; }
  #recentList { display: flex; flex-direction: column; gap: 6px; }
  #recentList button {
    text-align: left; background: var(--panel); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  #recentEmpty, #favEmpty { color: var(--muted); font-size: 14px; }
  #favList { display: flex; flex-direction: column; gap: 6px; }
  .chan-btn {
    display: flex; align-items: center; gap: 10px; text-align: left; background: var(--panel);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chan-btn img, .ch-head img { width: 32px; height: 32px; border-radius: 50%; flex: none; background: var(--panel-2); }
  .chan-btn span { overflow: hidden; text-overflow: ellipsis; }
  details { margin-top: 28px; background: var(--panel); border-radius: 10px; padding: 10px 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 15px; }
  details p { font-size: 14px; color: var(--muted); margin: 8px 0; }
  details textarea {
    width: 100%; min-height: 90px; background: var(--bg); color: var(--text);
    border: 1px solid var(--track); border-radius: 8px; padding: 8px; font: 13px/1.4 ui-monospace, monospace;
  }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .row input {
    flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--track);
    border-radius: 10px; padding: 8px 10px;
  }
  .note { font-size: 13px; min-height: 1.4em; margin: 6px 0 0; color: var(--muted); }
  .note.error { color: var(--danger); }
  a { color: var(--accent-text); }

  /* ---- 頻道影片清單 ---- */
  #channel { max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; }
  .ch-head { display: flex; align-items: center; gap: 10px; }
  .ch-head img { width: 40px; height: 40px; }
  #chTitle { flex: 1; min-width: 0; font-size: 18px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #favBtn.on { color: var(--accent-text); }
  .ch-tools { display: flex; gap: 8px; margin: 12px 0 8px; align-items: center; }
  .ch-tools input {
    flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--track);
    border-radius: 10px; padding: 8px 10px;
  }
  .tabs { display: flex; gap: 4px; }
  .tabs button { padding: 8px 12px; font-size: 14px; }
  .tabs button.active { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  #chList { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
  .video-card {
    display: flex; gap: 10px; text-align: left; padding: 6px; background: var(--panel); align-items: flex-start;
  }
  .video-card img { width: 128px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; flex: none; background: #000; }
  .video-card .t {
    font-size: 14px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .video-card .d { font-size: 12px; color: var(--muted); margin-top: 4px; }
  #chMore { width: 100%; margin-top: 12px; }

  /* ---- 播放畫面 ---- */
  #player { max-width: 1100px; margin: 0 auto; }
  .video-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  /* 不讓 iframe 吃掉觸控和按鍵：點畫面由外層處理播放／暫停，鍵盤焦點留在本頁 */
  .video-wrap iframe, .video-wrap > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  /* 手機例外：暫停過再播放時，YouTube 會在畫面中間留著播放／暫停圖示，
     要手指點到播放器才會自動隱藏，所以觸控裝置讓點擊進到播放器。 */
  @media (pointer: coarse) {
    .video-wrap iframe { pointer-events: auto; }
  }
  .info { padding: 8px 12px 16px; }
  #status {
    font-variant-numeric: tabular-nums; font-size: 15px; display: flex;
    flex-wrap: wrap; gap: 4px 16px; align-items: baseline;
  }
  #status .time { font-size: 18px; font-weight: 600; }
  #status .error { color: var(--danger); width: 100%; }
  #seek {
    -webkit-appearance: none; appearance: none; width: 100%; height: 32px;
    margin: 6px 0; background: transparent; touch-action: none;
  }
  #seek::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px;
    background: linear-gradient(to right, var(--accent) var(--played, 0%), var(--buffer) var(--played, 0%), var(--buffer) var(--loaded, 0%), var(--track) var(--loaded, 0%));
  }
  #seek::-moz-range-track {
    height: 6px; border-radius: 3px;
    background: linear-gradient(to right, var(--accent) var(--played, 0%), var(--buffer) var(--played, 0%), var(--buffer) var(--loaded, 0%), var(--track) var(--loaded, 0%));
  }
  #seek::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); margin-top: -7px; border: 0;
  }
  #seek::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); border: 0; }
  .controls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .controls button { padding: 14px 4px; font-size: 17px; }
  #playBtn { background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .settings { display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 6px; margin-top: 6px; }
  .settings button { font-size: 14px; padding: 8px 4px; white-space: nowrap; }
  .help { color: var(--muted); font-size: 13px; margin: 10px 0 0; }

  /* ---- 選單 ---- */
  dialog {
    background: var(--panel); color: var(--text); border: 0; border-radius: 14px;
    padding: 16px; width: min(320px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
  dialog h3 { margin: 0 0 10px; font-size: 17px; }
  .menu { display: flex; flex-direction: column; gap: 6px; }
  .menu button { text-align: left; }
  .menu button.current { outline: 2px solid var(--accent); }
  .custom-row { display: flex; gap: 6px; margin-top: 10px; }
  .custom-row input {
    flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--track);
    border-radius: 10px; padding: 8px 10px;
  }
  .dialog-error { color: var(--danger); font-size: 13px; min-height: 1.4em; margin: 6px 0 0; }

  @media (min-width: 700px) {
    .controls button { font-size: 18px; }
  }

  /* ---- 橫式（直板手機打橫、電腦）：影片在左、按鈕常駐右側，整個畫面不捲動 ----
     摺疊機打開接近正方形，不會進到這裡，維持上下排列。 */
  @media (min-aspect-ratio: 13/9) {
    #player {
      max-width: none;
      height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: 1fr clamp(150px, 24vw, 280px);
      grid-template-rows: 1fr auto auto;
      overflow: hidden;
    }
    /* 影片框填滿左側，YouTube 播放器自己會加黑邊維持比例 */
    .video-wrap { grid-column: 1; grid-row: 1; aspect-ratio: auto; height: 100%; min-height: 0; }
    .info { display: contents; }
    #status { grid-column: 1; grid-row: 2; padding: 4px 12px 0; font-size: 13px; }
    #status .time { font-size: 15px; }
    #status .meta { display: none; } /* 步距、速度已經顯示在右側按鈕上 */
    #seek { grid-column: 1; grid-row: 3; width: auto; margin: 0 12px 4px; height: 28px; }
    .help { display: none; }
    .pad {
      grid-column: 2; grid-row: 1 / -1;
      display: grid; gap: 6px; padding: 6px;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(5, minmax(0, 1fr));
      grid-template-areas:
        "sb sf"
        "lb lf"
        "pl pl"
        "ss ls"
        "rt hm";
    }
    .controls, .settings { display: contents; }
    .pad button { padding: 4px; font-size: 16px; min-height: 0; margin: 0; }
    .pad .settings button { font-size: 14px; }
    [data-step="small"][data-dir="-1"] { grid-area: sb; }
    [data-step="small"][data-dir="1"] { grid-area: sf; }
    [data-step="large"][data-dir="-1"] { grid-area: lb; }
    [data-step="large"][data-dir="1"] { grid-area: lf; }
    #playBtn { grid-area: pl; font-size: 22px; }
    #smallBtn { grid-area: ss; }
    #largeBtn { grid-area: ls; }
    #rateBtn { grid-area: rt; }
    #backBtn { grid-area: hm; }
  }
</style>
</head>
<body>

<section id="home">
  <div class="home-head">
    <h1>排球動作步進</h1>
    <button id="themeBtn" type="button" aria-label="切換深淺主題"></button>
  </div>
  <form class="open-row" id="openForm">
    <input id="urlInput" type="text" inputmode="url" autocomplete="off"
           placeholder="貼上 YouTube 影片或頻道網址" aria-label="YouTube 影片或頻道網址">
    <button type="submit">開啟</button>
  </form>
  <p id="openError"></p>
  <h2>我的最愛頻道</h2>
  <div id="favList"></div>
  <p id="favEmpty">還沒有最愛頻道。貼上頻道網址（例如 youtube.com/@頻道名稱），就能加入最愛。</p>
  <h2>最近看過</h2>
  <div id="recentList"></div>
  <p id="recentEmpty">還沒有紀錄。</p>

  <details id="backupBox">
    <summary>備份／還原最愛頻道</summary>
    <p>最愛只存在這支手機的這個瀏覽器裡。按「匯出」複製一段文字存起來，換手機或資料被清掉時，貼回來按「匯入」就能還原。</p>
    <textarea id="backupText" spellcheck="false" aria-label="備份文字"></textarea>
    <div class="row">
      <button id="exportBtn" type="button">匯出</button>
      <button id="importBtn" type="button">匯入</button>
    </div>
    <p class="note" id="backupNote"></p>
  </details>

  <details id="keyBox">
    <summary>YouTube API 金鑰</summary>
    <p>列出頻道影片需要 YouTube Data API 金鑰。這裡貼上的金鑰只存在你自己的瀏覽器。</p>
    <form class="row" id="keyForm">
      <input id="keyInput" type="text" autocomplete="off" spellcheck="false" placeholder="AIza…" aria-label="API 金鑰">
      <button type="submit">儲存</button>
    </form>
    <p class="note" id="keyNote"></p>
  </details>
</section>

<section id="channel" hidden>
  <div class="ch-head">
    <button id="chBack" aria-label="回首頁">←</button>
    <img id="chAvatar" alt="">
    <div id="chTitle"></div>
    <button id="favBtn"></button>
  </div>
  <div class="ch-tools">
    <div class="tabs">
      <button data-tab="videos" class="active">影片</button>
      <button data-tab="live">直播</button>
    </div>
    <input id="chFilter" type="search" placeholder="篩選標題" aria-label="篩選標題">
    <button id="chRefresh" aria-label="重新整理">⟳</button>
  </div>
  <p class="note" id="chNote"></p>
  <div id="chList"></div>
  <button id="chMore" hidden>載入更多</button>
</section>

<section id="player" hidden>
  <div class="video-wrap" id="videoWrap"><div id="ytPlayer"></div></div>
  <div class="info">
    <div id="status"></div>
    <input id="seek" type="range" min="0" max="0" step="1" value="0" aria-label="進度">
    <div class="pad">
    <div class="controls">
      <button data-step="large" data-dir="-1" aria-label="後退大步距">⏪ 大</button>
      <button data-step="small" data-dir="-1" aria-label="後退小步距">◀ 小</button>
      <button id="playBtn" aria-label="播放／暫停">▶</button>
      <button data-step="small" data-dir="1" aria-label="前進小步距">小 ▶</button>
      <button data-step="large" data-dir="1" aria-label="前進大步距">大 ⏩</button>
    </div>
    <div class="settings">
      <button id="backBtn">← 返回</button>
      <button id="smallBtn"></button>
      <button id="largeBtn"></button>
      <button id="rateBtn"></button>
    </div>
    </div>
    <p class="help" id="help"></p>
  </div>
</section>

<dialog id="stepDialog">
  <h3 id="stepDialogTitle"></h3>
  <div class="menu" id="stepMenu"></div>
  <form class="custom-row" id="customForm">
    <input id="customInput" type="text" inputmode="decimal" placeholder="自訂秒數，例如 0.03" aria-label="自訂秒數">
    <button type="submit">確定</button>
  </form>
  <p class="dialog-error" id="customError"></p>
</dialog>

<script src="config.js"></script>
<script>
"use strict";

// ---- 常數（與 Android 版一致） ----
const ONE_FRAME_30FPS = 1 / 30;
const STEP_KINDS = {
  small: { title: "小步距", short: "小", key: "small_step", def: 0.05, presets: [ONE_FRAME_30FPS, 0.05, 0.1, 0.2, 0.5] },
  large: { title: "大步距", short: "大", key: "large_step", def: 1, presets: [0.5, 1, 2, 5, 10, 30] },
};
const MIN_STEP = 0.01, MAX_STEP = 600;
const RATES = [0.25, 0.5, 1];
/** seek 之後這段時間內忽略播放器回報的時間，避免舊值蓋掉自己維護的游標。 */
const SEEK_SETTLE_MS = 600;
/** 按住步進鍵時，限制 seek 的頻率，避免塞爆播放器。 */
const REPEAT_SEEK_INTERVAL_MS = 120;
/** 觸控按住步進鍵多久後開始連續步進。 */
const TOUCH_REPEAT_DELAY_MS = 400;
/** 拖動進度條時，手指停在原地多久才送 seek（移動中不送，否則每次 seek 都打斷上一次載入）。 */
const SCRUB_DWELL_MS = 150;
/** 手指移動小於這個距離（px）視為「停住」。 */
const SCRUB_JITTER_PX = 6;
const RECENT_MAX = 10;
const ID_REGEX = /^[A-Za-z0-9_-]{11}$/;

const $ = (id) => document.getElementById(id);
const isTouch = matchMedia("(pointer: coarse)").matches;

// ---- localStorage（無痕模式等情況可能拋錯，一律包起來） ----
function load(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v == null ? fallback : JSON.parse(v);
  } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

// ---- 影片 ID ----
/** 從網址或純 ID 取出 11 碼影片 ID；看不懂就回傳 null。 */
function parseVideoId(input) {
  const text = (input || "").trim();
  if (ID_REGEX.test(text)) return text;
  // 分享文字可能夾帶其他字，先抓出第一個網址
  const match = text.match(/https?:\/\/\S+/);
  if (!match) return null;
  let url;
  try { url = new URL(match[0]); } catch { return null; }
  const host = url.hostname.replace(/^www\./, "").replace(/^m\./, "");
  const segments = url.pathname.split("/").filter(Boolean);
  let candidate = null;
  if (host === "youtu.be") {
    candidate = segments[0];
  } else if (host.endsWith("youtube.com")) {
    candidate = ["shorts", "live", "embed", "v"].includes(segments[0])
      ? segments[1]
      : url.searchParams.get("v");
  }
  return candidate && ID_REGEX.test(candidate) ? candidate : null;
}

// ---- 最近看過 ----
function recentList() { return load("recent", []); }
function addRecent(id, title) {
  const list = recentList();
  const existing = list.find((v) => v.id === id) || { id, title: null };
  if (title) existing.title = title;
  save("recent", [existing, ...list.filter((v) => v.id !== id)].slice(0, RECENT_MAX));
}
function setRecentTitle(id, title) {
  save("recent", recentList().map((v) => (v.id === id ? { ...v, title } : v)));
}

/** 用 YouTube 官方 oEmbed 取影片標題，不需要 API key。 */
async function fetchTitle(id) {
  try {
    const watch = encodeURIComponent(`https://www.youtube.com/watch?v=${id}`);
    const res = await fetch(`https://www.youtube.com/oembed?format=json&url=${watch}`);
    if (!res.ok) return null;
    const json = await res.json();
    return json.title || null;
  } catch { return null; }
}

const titlesInFlight = new Set();
function renderRecent() {
  const container = $("recentList");
  container.replaceChildren();
  const list = recentList();
  $("recentEmpty").hidden = list.length > 0;
  for (const video of list) {
    const button = document.createElement("button");
    button.textContent = video.title || video.id;
    button.addEventListener("click", () => openVideo(video.id));
    container.append(button);
    if (!video.title && !titlesInFlight.has(video.id)) {
      titlesInFlight.add(video.id);
      fetchTitle(video.id).then((title) => {
        titlesInFlight.delete(video.id);
        if (title) {
          setRecentTitle(video.id, title);
          button.textContent = title;
        }
      });
    }
  }
}

// ---- 步距設定 ----
function getStep(kind) {
  const v = load(STEP_KINDS[kind].key, null);
  return typeof v === "number" && v >= MIN_STEP && v <= MAX_STEP ? v : STEP_KINDS[kind].def;
}
function setStep(kind, seconds) {
  save(STEP_KINDS[kind].key, seconds);
  updateStatus();
}
/** 0.05 → "0.05s"，1 → "1s"，1/30 → "1格" */
function formatStep(seconds) {
  if (Math.abs(seconds - ONE_FRAME_30FPS) < 1e-4) return "1格";
  return `${parseFloat(seconds.toFixed(3))}s`;
}
function formatTime(seconds) {
  const totalCentis = Math.floor(seconds * 100);
  const minutes = Math.floor(totalCentis / 6000);
  const secs = Math.floor((totalCentis % 6000) / 100);
  const centis = totalCentis % 100;
  return `${minutes}:${String(secs).padStart(2, "0")}.${String(centis).padStart(2, "0")}`;
}

// ---- 播放器狀態 ----
let player = null;
let playerReady = false;
let pendingVideoId = null;
let videoId = null;
// getCurrentTime() 在 seek 後一段時間內會回報舊值，所以自己維護目前時間。
let cursor = 0;
let duration = 0;
let playing = false;
let lastSeekAt = 0;
let rateIndex = RATES.length - 1;
let errorMessage = null;
let pollTimer = null;

// 進度條拖動狀態
let scrubbing = false;
let resumeAfterScrub = false;
let lastScrubTarget = -1;
let dwellAnchor = -1;
let dwellTimer = null;

// ---- YouTube IFrame API ----
function loadYouTubeApi() {
  if (window.YT || document.querySelector("script[data-yt]")) return;
  const script = document.createElement("script");
  script.src = "https://www.youtube.com/iframe_api";
  script.dataset.yt = "1";
  document.head.append(script);
}

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player("ytPlayer", {
    width: "100%",
    height: "100%",
    host: "https://www.youtube.com",
    playerVars: {
      controls: 0,       // 隱藏 YouTube 自己的控制列
      rel: 0,
      iv_load_policy: 3, // 不顯示資訊卡
      fs: 0,
      playsinline: 1,    // iPhone 不要自動跳全螢幕
      disablekb: 1,
      origin: location.origin,
    },
    events: {
      onReady: () => {
        playerReady = true;
        if (pendingVideoId) cueVideo(pendingVideoId);
      },
      onStateChange: (e) => {
        playing = e.data === YT.PlayerState.PLAYING;
        refreshDuration();
        if (playing) startPolling(); else stopPolling();
        updateStatus();
      },
      onPlaybackRateChange: (e) => {
        const i = RATES.indexOf(e.data);
        if (i >= 0) rateIndex = i;
        updateStatus();
      },
      onError: (e) => {
        errorMessage = {
          2: "影片 ID 不正確",
          5: "瀏覽器無法播放這支影片",
          100: "找不到影片（可能是私人或已刪除）",
          101: "這支影片不允許嵌入播放",
          150: "這支影片不允許嵌入播放",
          153: "YouTube 拒絕播放：瀏覽器沒有送出來源網址（Referer）",
        }[e.data] || `播放錯誤：${e.data}`;
        updateStatus();
      },
    },
  });
};

function cueVideo(id) {
  pendingVideoId = null;
  player.cueVideoById({ videoId: id, startSeconds: 0 });
  player.setPlaybackRate(RATES[rateIndex]);
}

function refreshDuration() {
  const d = player && player.getDuration ? player.getDuration() : 0;
  if (d > 0 && d !== duration) {
    duration = d;
    $("seek").max = Math.round(d * 1000);
  }
}

/** IFrame API 沒有時間回報事件，播放中自己輪詢。 */
function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(() => {
    if (!player) return;
    if (playing && !scrubbing && performance.now() - lastSeekAt > SEEK_SETTLE_MS) {
      cursor = player.getCurrentTime();
    }
    updateStatus();
  }, 100);
}
function stopPolling() {
  clearInterval(pollTimer);
  pollTimer = null;
}

// ---- 播放控制 ----
function seekTo(seconds) {
  cursor = seconds;
  lastSeekAt = performance.now();
  player.seekTo(seconds, true);
  updateStatus();
}

function step(kind, direction, isRepeat) {
  if (!playerReady || scrubbing || !videoId) return;
  const now = performance.now();
  if (isRepeat && now - lastSeekAt < REPEAT_SEEK_INTERVAL_MS) return;
  if (playing) {
    player.pauseVideo();
    playing = false;
  }
  const max = duration > 0 ? duration : Number.MAX_VALUE;
  seekTo(Math.min(max, Math.max(0, cursor + direction * getStep(kind))));
}

function togglePlay() {
  if (!playerReady || !videoId) return;
  if (playing) {
    player.pauseVideo();
  } else {
    lastSeekAt = performance.now();
    player.playVideo();
  }
}

function changeRate(delta, wrap) {
  rateIndex = wrap
    ? (rateIndex + delta + RATES.length) % RATES.length
    : Math.min(RATES.length - 1, Math.max(0, rateIndex + delta));
  if (playerReady) player.setPlaybackRate(RATES[rateIndex]);
  updateStatus();
}

function updateStatus() {
  const small = formatStep(getStep("small"));
  const large = formatStep(getStep("large"));
  const rate = RATES[rateIndex];
  const status = $("status");
  status.replaceChildren();
  const add = (cls, text) => {
    const span = document.createElement("span");
    span.className = cls;
    span.textContent = text;
    status.append(span);
  };
  add("time", `${playing ? "▶" : "❚❚"}  ${formatTime(cursor)} / ${formatTime(duration)}`);
  add("meta", `小步 ${small}　大步 ${large}　速度 ${rate}x`);
  if (errorMessage) add("error", `⚠ ${errorMessage}`);

  const seek = $("seek");
  if (!scrubbing) seek.value = Math.round(cursor * 1000);
  const max = Number(seek.max) || 1;
  seek.style.setProperty("--played", `${(Number(seek.value) / max) * 100}%`);
  const loaded = playerReady && player.getVideoLoadedFraction ? player.getVideoLoadedFraction() : 0;
  seek.style.setProperty("--loaded", `${loaded * 100}%`);

  $("playBtn").textContent = playing ? "❚❚" : "▶";
  $("smallBtn").textContent = `小 ${small}`;
  $("largeBtn").textContent = `大 ${large}`;
  $("rateBtn").textContent = `${rate}x`;
}

// ---- 進度條 ----
function jitterTolerance() {
  const seek = $("seek");
  const width = Math.max(1, seek.clientWidth - 20);
  return (Number(seek.max) * SCRUB_JITTER_PX) / width;
}

function scrubSeekTo(progress) {
  if (!playerReady) return;
  lastScrubTarget = progress;
  seekTo(progress / 1000);
}

function setupSeekBar() {
  const seek = $("seek");
  seek.addEventListener("pointerdown", () => {
    scrubbing = true;
    resumeAfterScrub = playing;
    lastScrubTarget = -1;
    dwellAnchor = -1;
    // 暫停後 seek 才會停在那一格給你看
    if (playing && playerReady) {
      player.pauseVideo();
      playing = false;
    }
  });
  seek.addEventListener("input", () => {
    const progress = Number(seek.value);
    cursor = progress / 1000;
    updateStatus();
    if (!scrubbing) {
      // 鍵盤操作進度條等非拖動情況，直接跳
      scrubSeekTo(progress);
      return;
    }
    // 抖動範圍內的移動不重設計時，否則手指永遠「沒停住」
    if (dwellAnchor >= 0 && Math.abs(progress - dwellAnchor) <= jitterTolerance()) return;
    dwellAnchor = progress;
    clearTimeout(dwellTimer);
    dwellTimer = setTimeout(() => scrubSeekTo(Number(seek.value)), SCRUB_DWELL_MS);
  });
  const endScrub = () => {
    if (!scrubbing) return;
    scrubbing = false;
    clearTimeout(dwellTimer);
    const target = Number(seek.value);
    if (lastScrubTarget >= 0 && Math.abs(target - lastScrubTarget) <= jitterTolerance()) {
      // 放開的位置就是剛剛預覽的位置，不再 seek，免得打斷正在載入的畫面
      cursor = lastScrubTarget / 1000;
      updateStatus();
    } else {
      scrubSeekTo(target);
    }
    if (resumeAfterScrub && playerReady) player.playVideo();
  };
  seek.addEventListener("pointerup", endScrub);
  seek.addEventListener("pointercancel", endScrub);
  seek.addEventListener("change", endScrub);
}

// ---- 觸控按鈕 ----
/** 點一下步進一次；按住超過 TOUCH_REPEAT_DELAY_MS 就連續步進。 */
function bindHoldToStep(button) {
  const kind = button.dataset.step;
  const direction = Number(button.dataset.dir);
  let delayTimer = null, repeatTimer = null;
  const stop = () => {
    button.classList.remove("pressed");
    clearTimeout(delayTimer);
    clearInterval(repeatTimer);
  };
  button.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    button.setPointerCapture(e.pointerId);
    button.classList.add("pressed");
    step(kind, direction, false);
    delayTimer = setTimeout(() => {
      repeatTimer = setInterval(() => step(kind, direction, true), REPEAT_SEEK_INTERVAL_MS);
    }, TOUCH_REPEAT_DELAY_MS);
  });
  button.addEventListener("pointerup", stop);
  button.addEventListener("pointercancel", stop);
  button.addEventListener("contextmenu", (e) => e.preventDefault());
}

// ---- 鍵盤 ----
const keyRepeat = {};
document.addEventListener("keydown", (e) => {
  if ($("player").hidden || $("stepDialog").open) return;
  if (e.target instanceof HTMLInputElement && e.target.type !== "range") return;
  const repeat = e.repeat;
  switch (e.key) {
    case "ArrowLeft": case ",": step("small", -1, repeat); break;
    case "ArrowRight": case ".": step("small", 1, repeat); break;
    case "ArrowDown": step("large", -1, repeat); break;
    case "ArrowUp": step("large", 1, repeat); break;
    case " ": case "Enter": case "k": if (!repeat) togglePlay(); break;
    case "[": if (!repeat) changeRate(-1, false); break;
    case "]": if (!repeat) changeRate(1, false); break;
    case "Escape": if (!repeat) goBack(); break;
    default: return;
  }
  e.preventDefault();
});

// ---- 頻道（YouTube Data API v3） ----
const CHANNEL_ID_REGEX = /^UC[A-Za-z0-9_-]{22}$/;
const API_BASE = "https://www.googleapis.com/youtube/v3/";
const PAGE_SIZE = 50;
/** 頻道影片清單快取多久（毫秒）。 */
const LIST_CACHE_MS = 60 * 60 * 1000;
/**
 * 頻道上傳清單的變體：UULF 只有一般影片（不含 Shorts、直播），UULV 只有直播存檔。
 * 這兩個是 YouTube 沒有寫進文件的慣例，查不到時影片分頁退回 UU（全部上傳）。
 */
const TABS = {
  videos: { prefix: "UULF", fallback: "UU", empty: "這個頻道還沒有影片" },
  live: { prefix: "UULV", fallback: null, empty: "這個頻道沒有直播存檔" },
};

class ApiError extends Error {
  constructor(reason, status) {
    super(reason);
    this.reason = reason;
    this.status = status;
  }
}

function apiKey() {
  return load("apiKey", "") || window.YT_API_KEY || "";
}

async function ytApi(path, params) {
  const key = apiKey();
  if (!key) throw new ApiError("noKey");
  const url = new URL(API_BASE + path);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  url.searchParams.set("key", key);
  let res;
  try { res = await fetch(url); } catch { throw new ApiError("network"); }
  const json = await res.json().catch(() => ({}));
  if (!res.ok) {
    const detail = json.error && json.error.errors && json.error.errors[0];
    throw new ApiError((detail && detail.reason) || String(res.status), res.status);
  }
  return json;
}

function apiErrorMessage(err) {
  switch (err.reason) {
    case "noKey": return "還沒設定 YouTube API 金鑰（首頁最下方）";
    case "network": return "連不上 YouTube，請檢查網路";
    case "custom": return "這種 /c/ 舊式網址查不到，請改貼頻道首頁「@名稱」的網址";
    case "channelNotFound": return "找不到這個頻道";
    case "keyInvalid": case "badRequest": return "API 金鑰無效，請檢查首頁最下方的金鑰";
    case "quotaExceeded": case "dailyLimitExceeded": return "今天的 API 用量已滿，明天再試";
    case "accessNotConfigured": return "這把金鑰還沒啟用 YouTube Data API v3";
    case "forbidden": case "ipRefererBlocked": return "這把金鑰不允許在這個網址使用，請檢查金鑰的網址限制";
    default: return `查詢失敗（${err.reason || err.message}）`;
  }
}

/** 從網址或 @名稱 判斷是哪個頻道；看不懂回傳 null。 */
function parseChannelRef(input) {
  const text = (input || "").trim();
  if (CHANNEL_ID_REGEX.test(text)) return { id: text };
  if (/^@[^\s/?#]+$/.test(text)) return { handle: text };
  const match = text.match(/(?:https?:\/\/)?(?:[\w-]+\.)?youtube\.com\/\S*/);
  if (!match) return null;
  let url;
  try { url = new URL(/^https?:/.test(match[0]) ? match[0] : `https://${match[0]}`); } catch { return null; }
  const segments = url.pathname.split("/").filter(Boolean).map(decodeURIComponent);
  const [first, second] = segments;
  if (!first) return null;
  if (first.startsWith("@")) return { handle: first };
  if (first === "channel" && CHANNEL_ID_REGEX.test(second || "")) return { id: second };
  if (first === "user" && second) return { username: second };
  if (first === "c" && second) return { custom: second };
  return null;
}

function cachedChannels() { return load("channelInfo", {}); }

/** 查頻道基本資料（名稱、頭像），結果記在 localStorage，之後開同一個頻道不用再查。 */
async function resolveChannel(ref) {
  if (ref.custom) throw new ApiError("custom");
  if (ref.id) {
    const known = favList().find((c) => c.id === ref.id) || cachedChannels()[ref.id];
    if (known) return known;
  }
  const params = { part: "snippet" };
  if (ref.id) params.id = ref.id;
  else if (ref.handle) params.forHandle = ref.handle;
  else params.forUsername = ref.username;
  const json = await ytApi("channels", params);
  const item = json.items && json.items[0];
  if (!item) throw new ApiError("channelNotFound");
  const thumbs = item.snippet.thumbnails || {};
  const channel = {
    id: item.id,
    title: item.snippet.title,
    thumb: (thumbs.default || thumbs.medium || {}).url || "",
  };
  const cache = cachedChannels();
  cache[channel.id] = channel;
  save("channelInfo", cache);
  return channel;
}

  const note = $("backupNote");

    const data = JSON.parse($("backupText").value);
    const incoming = (data.favChannels || []).filter((c) => c && CHANNEL_ID_REGEX.test(c.id) && typeof c.title === "string");
    if (!incoming.length) throw new Error();

});

// ---- 頻道影片清單 ----
/** 目前頻道畫面的狀態；items 是已載入的影片，next 是下一頁的 pageToken。 */
let chState = null;
let chLoadToken = 0;

function playlistCacheKey(playlistId) { return `pl:${playlistId}`; }

function saveListCache(state) {
  const value = JSON.stringify({ at: Date.now(), items: state.items, next: state.next, playlistId: state.playlistId });
  const key = playlistCacheKey(`${state.channel.id}:${state.tab}`);
  try {
    localStorage.setItem(key, value);
  } catch {
    // 空間不夠：清掉所有清單快取再試一次
    try {
      Object.keys(localStorage).filter((k) => k.startsWith("pl:")).forEach((k) => localStorage.removeItem(k));
      localStorage.setItem(key, value);
    } catch {}
  }
}

function loadListCache(channelId, tab) {
  const cached = load(playlistCacheKey(`${channelId}:${tab}`), null);
  return cached && Date.now() - cached.at < LIST_CACHE_MS ? cached : null;
}

async function showChannel(id) {
  const fromPlayer = currentView === "player";
  showView("channel");
  if (chState && chState.channel.id === id) {
    renderChannelHeader();
    renderVideoList();
    if (fromPlayer) scrollTo(0, channelScroll);
    return;
  }
  const token = ++chLoadToken;
  chState = null;
  scrollTo(0, 0);
  $("chTitle").textContent = "";
  $("chAvatar").removeAttribute("src");
  $("favBtn").hidden = true;
  $("chList").replaceChildren();
  $("chMore").hidden = true;
  $("chFilter").value = "";
  setChannelNote("載入中…");
  let channel;
  try {
    channel = await resolveChannel({ id });
  } catch (err) {
    if (token === chLoadToken) setChannelNote(apiErrorMessage(err), true);
    return;
  }
  if (token !== chLoadToken) return;
  chState = { channel, tab: "videos", items: [], next: null, playlistId: null, done: false, loading: false, req: 0 };
  document.title = channel.title;
  renderChannelHeader();
  for (const b of document.querySelectorAll(".tabs button")) b.hidden = false;
  selectTab("videos");
}

function renderChannelHeader() {
  const { channel } = chState;
  $("chTitle").textContent = channel.title;
  if (channel.thumb) $("chAvatar").src = channel.thumb;
  const fav = isFav(channel.id);
  $("favBtn").hidden = false;
  $("favBtn").textContent = fav ? "★ 最愛" : "☆ 加入最愛";
  $("favBtn").classList.toggle("on", fav);
  for (const b of document.querySelectorAll(".tabs button")) b.classList.toggle("active", b.dataset.tab === chState.tab);
}

function setChannelNote(text, isError) {
  $("chNote").textContent = text || "";
  $("chNote").classList.toggle("error", !!isError);
}

function selectTab(tab, forceRefresh) {
  const state = chState;
  state.tab = tab;
  state.req = (state.req || 0) + 1; // 作廢進行中的請求
  state.loading = false;
  const cached = !forceRefresh && loadListCache(state.channel.id, tab);
  Object.assign(state, cached
    ? { items: cached.items, next: cached.next, playlistId: cached.playlistId, done: !cached.next }
    : { items: [], next: null, playlistId: null, done: false });
  renderChannelHeader();
  renderVideoList();
  if (!cached) loadMore();
}

async function loadMore() {
  const state = chState;
  if (!state || state.loading || state.done) return;
  state.loading = true;
  // 每次請求一個編號；切分頁或重新整理後，舊請求回來的結果直接丟掉
  const req = state.req = (state.req || 0) + 1;
  const tab = state.tab;
  const stale = () => state !== chState || req !== state.req;
  setChannelNote("載入中…");
  $("chMore").hidden = true;
  const suffix = state.channel.id.slice(2);
  let playlistId = state.playlistId || TABS[tab].prefix + suffix;
  try {
    let json;
    try {
      json = await fetchPlaylistPage(playlistId, state.next);
    } catch (err) {
      // 變體清單不存在（例如頻道沒有直播）時 API 回 404
      if (err.status !== 404 || state.items.length) throw err;
      if (!TABS[tab].fallback) {
        json = { items: [] };
      } else {
        playlistId = TABS[tab].fallback + suffix;
        json = await fetchPlaylistPage(playlistId, null);
      }
    }
    if (stale()) return;
    state.playlistId = playlistId;
    state.items.push(...json.items.map(toVideo).filter(Boolean));
    state.next = json.nextPageToken || null;
    state.done = !state.next;
    saveListCache(state);
    setChannelNote("");
  } catch (err) {
    if (!stale()) setChannelNote(apiErrorMessage(err), true);
  } finally {
    if (!stale()) {
      state.loading = false;
      renderVideoList();
    }
  }
}

function fetchPlaylistPage(playlistId, pageToken) {
  const params = { part: "snippet,contentDetails", playlistId, maxResults: PAGE_SIZE };
  if (pageToken) params.pageToken = pageToken;
  return ytApi("playlistItems", params);
}

/** 把 API 回傳的項目轉成我們要的欄位；私人或已刪除的影片丟掉。 */
function toVideo(item) {
  const thumbs = item.snippet.thumbnails || {};
  const thumb = (thumbs.medium || thumbs.default || {}).url;
  if (!thumb) return null;
  return {
    id: item.contentDetails.videoId,
    title: item.snippet.title,
    date: (item.contentDetails.videoPublishedAt || item.snippet.publishedAt || "").slice(0, 10),
    thumb,
  };
}

function renderVideoList() {
  const state = chState;
  if (!state) return;
  const query = $("chFilter").value.trim().toLowerCase();
  const shown = query ? state.items.filter((v) => v.title.toLowerCase().includes(query)) : state.items;
  $("chList").replaceChildren(...shown.map((video) => {
    const button = document.createElement("button");
    button.className = "video-card";
    const img = document.createElement("img");
    img.alt = "";
    img.loading = "lazy";
    img.src = video.thumb;
    const text = document.createElement("div");
    const title = document.createElement("div");
    title.className = "t";
    title.textContent = video.title;
    const date = document.createElement("div");
    date.className = "d";
    date.textContent = video.date;
    text.append(title, date);
    button.append(img, text);
    button.addEventListener("click", () => openVideo(video.id, video.title));
    return button;
  }));
  $("chMore").hidden = state.done || state.loading;
  if (state.loading) return;
  if (!state.items.length && state.done) {
    if (state.tab === "live") {
      // 沒有直播存檔就把分頁藏起來，切回影片
      document.querySelector('.tabs button[data-tab="live"]').hidden = true;
      selectTab("videos");
      return;
    }
    setChannelNote(TABS[state.tab].empty);
  } else if (query && !shown.length) {
    setChannelNote(state.done
      ? `${state.items.length} 支影片中沒有符合的`
      : `已載入的 ${state.items.length} 支影片中沒有符合的，可以按「載入更多」再找`);
  } else if (!$("chNote").classList.contains("error")) {
    setChannelNote("");
  }
}

$("chBack").addEventListener("click", goBack);
$("favBtn").addEventListener("click", () => {
  if (!chState) return;
  toggleFav(chState.channel);
  renderChannelHeader();
});
$("chMore").addEventListener("click", loadMore);
$("chFilter").addEventListener("input", renderVideoList);
$("chRefresh").addEventListener("click", () => {
  if (chState) selectTab(chState.tab, true);
});
for (const b of document.querySelectorAll(".tabs button")) {
  b.addEventListener("click", () => {
    if (chState && chState.tab !== b.dataset.tab) selectTab(b.dataset.tab);
  });
}

// ---- 深淺主題 ----
const THEMES = [
  { value: "auto", label: "🌓 跟隨系統" },
  { value: "light", label: "☀️ 淺色" },
  { value: "dark", label: "🌙 深色" },
];
function renderThemeButton() {
  const current = load("theme", "auto");
  $("themeBtn").textContent = (THEMES.find((t) => t.value === current) || THEMES[0]).label;
}
$("themeBtn").addEventListener("click", () => {
  const i = THEMES.findIndex((t) => t.value === load("theme", "auto"));
  save("theme", THEMES[(i + 1) % THEMES.length].value);
  window.applyTheme();
  renderThemeButton();
});
renderThemeButton();

// ---- 畫面切換 ----
// 網址：#v=影片ID 播放、#c=頻道ID 頻道清單、空白是首頁。可以分享，也能用返回鍵往回。
function navigate(hash) {
  // 標記是 App 內部跳轉，「返回」時才能用 history.back() 回到上一個畫面
  history.pushState({ internal: true }, "", `#${hash}`);
  route();
}
function openVideo(id, title) {
  if (title) addRecent(id, title);
  navigate(`v=${id}`);
}
function openChannel(id) {
  navigate(`c=${id}`);
}
function goBack() {
  if (history.state && history.state.internal) {
    history.back();
  } else {
    history.replaceState(null, "", location.pathname);
    route();
  }
}

function route() {
  const params = new URLSearchParams(location.hash.slice(1));
  const id = parseVideoId(params.get("v") || "");
  const channelId = params.get("c") || "";
  if (id) showPlayer(id);
  else if (CHANNEL_ID_REGEX.test(channelId)) showChannel(channelId);
  else showHome();
}

let currentView = "home";
let channelScroll = 0;
function showView(name) {
  if (currentView === "channel" && name !== "channel") channelScroll = scrollY;
  if (currentView === "player" && name !== "player") {
    if (playerReady && videoId) player.stopVideo();
    stopPolling();
    videoId = null;
  }
  for (const view of ["home", "channel", "player"]) $(view).hidden = view !== name;
  const changed = currentView !== name;
  currentView = name;
  return changed;
}

function showHome() {
  if (showView("home")) scrollTo(0, 0);
  document.title = "排球動作步進";
  renderFavorites();
  renderRecent();
}

function showPlayer(id) {
  if (showView("player")) scrollTo(0, 0);
  addRecent(id);
  if (id === videoId) return;
  videoId = id;
  cursor = 0;
  duration = 0;
  playing = false;
  errorMessage = null;
  $("seek").max = 0;
  updateStatus();
  loadYouTubeApi();
  if (playerReady) cueVideo(id); else pendingVideoId = id;
  const cached = recentList().find((v) => v.id === id);
  if (cached && cached.title) document.title = cached.title;
}

// ---- 初始化 ----
$("openForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = $("urlInput").value;
  const id = parseVideoId(input);
  if (id) {
    $("openError").textContent = "";
    $("urlInput").value = "";
    openVideo(id);
    return;
  }
  const ref = parseChannelRef(input);
  if (!ref) {
    $("openError").textContent = "看不懂這個網址，請貼 YouTube 影片或頻道網址";
    return;
  }
  if (!apiKey()) {
    $("openError").textContent = "列出頻道影片要先設定 YouTube API 金鑰（在最下方）";
    $("keyBox").open = true;
    return;
  }
  $("openError").textContent = "查詢頻道中…";
  try {
    const channel = await resolveChannel(ref);
    $("openError").textContent = "";
    $("urlInput").value = "";
    openChannel(channel.id);
  } catch (err) {
    $("openError").textContent = apiErrorMessage(err);
  }
});
$("urlInput").addEventListener("input", () => { $("openError").textContent = ""; });

document.querySelectorAll("[data-step]").forEach(bindHoldToStep);
$("playBtn").addEventListener("click", togglePlay);
$("videoWrap").addEventListener("click", togglePlay);
$("smallBtn").addEventListener("click", () => showStepPicker("small"));
$("largeBtn").addEventListener("click", () => showStepPicker("large"));
$("rateBtn").addEventListener("click", () => changeRate(1, true));
$("backBtn").addEventListener("click", goBack);
$("help").textContent = isTouch
  ? "按住步進鍵可連續步進　拖動進度條、手指停住就會預覽　點「小／大」設定步距　影片中間的圖示不消失時，點一下影片"
  : "←/→ 小步　↓/↑ 大步　空白鍵 播放/暫停　[ / ] 調速度　Esc 返回";
setupSeekBar();

// 從分享（PWA share target）或 ?v= 進來的，轉成 #v=
(() => {
  const params = new URLSearchParams(location.search);
  const shared = params.get("v") || params.get("url") || params.get("text") || params.get("title");
  if (shared != null) {
    const id = parseVideoId(shared) || parseVideoId(`${params.get("text") || ""} ${params.get("url") || ""}`);
    history.replaceState(null, "", location.pathname + (id ? `#v=${id}` : ""));
  }
})();
// 捲動位置由 showView／showChannel 自己處理，不讓瀏覽器在返回時另外還原
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
window.addEventListener("popstate", route);
route();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
